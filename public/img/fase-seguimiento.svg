<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="fondo" cx="50%" cy="10%" r="95%">
      <stop offset="0%" stop-color="#eaf2fd"/>
      <stop offset="100%" stop-color="#fafbfd"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>

  <!-- panel principal -->
  <rect x="90" y="90" width="420" height="300" rx="14" fill="#ffffff" stroke="url(#azul)" stroke-width="1.5"/>
  <line x1="130" y1="350" x2="470" y2="350" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="1.5"/>
  <line x1="130" y1="350" x2="130" y2="130" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- línea de madurez ascendente -->
  <path d="M130 320 L210 290 L290 300 L370 230 L450 160"
        fill="none" stroke="url(#azul)" stroke-width="4" stroke-linecap="round"/>
  <path d="M130 320 L210 290 L290 300 L370 230 L450 160 L450 350 L130 350 Z" fill="url(#area)"/>
  <g fill="#2563eb">
    <circle cx="210" cy="290" r="5"/>
    <circle cx="290" cy="300" r="5"/>
    <circle cx="370" cy="230" r="5"/>
    <circle cx="450" cy="160" r="6" stroke="#101828" stroke-width="1.5"/>
  </g>

  <!-- panel lateral: KPIs -->
  <rect x="540" y="90" width="180" height="140" rx="14" fill="#ffffff" stroke="url(#azul)" stroke-width="1.5"/>
  <g stroke="#2563eb" stroke-width="6" stroke-linecap="round">
    <line x1="570" y1="200" x2="570" y2="150"/>
    <line x1="600" y1="200" x2="600" y2="130"/>
    <line x1="630" y1="200" x2="630" y2="170"/>
    <line x1="660" y1="200" x2="660" y2="120"/>
    <line x1="690" y1="200" x2="690" y2="145"/>
  </g>

  <!-- panel lateral: semáforo -->
  <rect x="540" y="250" width="180" height="140" rx="14" fill="#ffffff" stroke="url(#azul)" stroke-width="1.5"/>
  <circle cx="580" cy="290" r="10" fill="#15803d"/>
  <circle cx="620" cy="290" r="10" fill="#2563eb"/>
  <circle cx="660" cy="290" r="10" fill="#be123c"/>
  <g stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="565" y1="340" x2="700" y2="340"/>
    <line x1="565" y1="360" x2="660" y2="360"/>
  </g>

  <!-- línea base -->
  <line x1="70" y1="440" x2="740" y2="440" stroke="url(#azul)" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
